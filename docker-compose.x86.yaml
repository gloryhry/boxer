name: boxer

services:
  server:
    image: boxer-server:x86
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.x86
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 90s
    shm_size: 1gb
    ports:
      - "${SERVER_PORT:-18765}:18765"
    environment:
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-4}"
      TORCHINDUCTOR_COMPILE_THREADS: "${TORCHINDUCTOR_COMPILE_THREADS:-1}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ${NAV_MAP_DIR:-./nav_map}
        target: /nav_map
        bind:
          create_host_path: false
      - type: bind
        source: ${CKPTS_DIR:-./ckpts}
        target: /app/ckpts
        bind:
          create_host_path: false
      - type: bind
        source: ${VOCAB_DIR:-./owl}
        target: /vocab
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OUTPUT_DIR:-./output/server}
        target: /app/output/server
      - cache:/cache

volumes:
  cache:
