# 新任务会重新读取本文件。API 或命令行显式填写的参数优先用于该次任务。

# 体素边长，单位米，范围 0.02–5。越小保留的几何细节越多，网格、内存和耗时也越大。
voxel: 0.2

# 可见性目标的采样数量，整数，范围 16–2048。调大可比较更多位置，计算量也会增加。
vis_targets: 256

# 房间标签回投到三维后要求的最少点数。低于阈值的房间标为未分配，0 关闭点数筛选。
min_room_points: 0

# 最小房间平面面积，单位平方米。调大可清理更多小碎片，0 关闭按面积清理。
min_room_area: 2.0

# 相邻区域允许合并的最小有效开口宽度，单位米。越大合并越保守，0 关闭宽开口合并。
merge_opening: 1.6

# 从已标记体素向原始点云补标签时的最大三维距离，单位米。
# 调大可覆盖更多墙面和顶面，也更容易跨边界着色。0 表示距离不限。
max_projection_distance: 0.8

# true 使用统一高度采样以减少分层顶面的干扰。false 使用原最高栈采样作对照。
ceiling_aware: true

# 整幅场景的估算网格体素数上限，填正整数。出现「网格过大」时查这一项。
# 15000000 表示 1500 万。按任务日志中的网格估算和服务器可用内存调整。
max_grid_voxels: 15000000

# 可见性计算前允许的室内栈数上限，填正整数。一个栈对应俯视网格中的一列体素。
# 日志提示「室内栈数超过计算保护阈值」时查这一项。调大允许处理更多栈，也会增加计算开销。
max_stacks: 50000
